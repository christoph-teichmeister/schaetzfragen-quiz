<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schätzfragen</title>
  <meta name="theme-color" content="#6366f1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Schätzfragen" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #ffffff;
      --surface:   #f8fafc;
      --border:    #e2e8f0;
      --text:      #0f172a;
      --text-2:    #64748b;
      --accent:    #6366f1;
      --accent-dk: #4f46e5;
      --accent-bg: #eef2ff;
      --answer:    #059669;
      --answer-bg: #ecfdf5;
      --hint:      #d97706;
      --hint-bg:   #fffbeb;
      --radius:    16px;
      --radius-sm: 10px;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ── SELECTOR VIEW ── */
    #view-selector {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding: 0 0 env(safe-area-inset-bottom);
    }
    #view-selector.hidden { display: none; }

    .selector-header {
      padding: 3rem 1.5rem 1rem;
      text-align: center;
    }
    .selector-header .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px; height: 52px;
      background: var(--accent);
      border-radius: 14px;
      font-size: 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 4px 14px rgba(99,102,241,0.35);
    }
    .selector-header h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .selector-header p {
      margin-top: 0.4rem;
      color: var(--text-2);
      font-size: 1rem;
    }

    .set-grid {
      flex: 1;
      padding: 1rem 1rem 1.5rem;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      align-content: start;
    }
    @media (min-width: 560px) {
      .set-grid { grid-template-columns: repeat(3, 1fr); padding: 1rem 1.5rem 2rem; }
    }
    @media (min-width: 860px) {
      .set-grid { grid-template-columns: repeat(4, 1fr); max-width: 900px; margin: 0 auto; }
      .selector-header { padding-top: 4rem; }
    }

    .set-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.5rem;
      padding: 1rem;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
      text-align: left;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }
    .set-card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-bg);
      transform: translateY(-1px);
    }
    .set-card:active { transform: scale(0.97); }
    .set-card .card-emoji {
      font-size: 1.75rem;
      line-height: 1;
    }
    .set-card .card-title {
      font-family: 'Syne', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }
    .set-card .card-count {
      font-size: 0.72rem;
      color: var(--text-2);
    }

    .all-played-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-2);
    }
    .all-played-emoji { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .all-played-msg > div:nth-child(2) {
      font-family: 'Syne', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.35rem;
    }
    .all-played-sub { font-size: 0.85rem; }
    .set-card--played {
      opacity: 0.6;
    }
    .set-card--played .card-count {
      color: var(--answer);
      font-weight: 600;
    }
    .set-reset-btn {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      width: 26px; height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--border);
      background: var(--bg);
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--text-2);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .set-reset-btn:hover {
      background: var(--surface);
      border-color: var(--accent);
      color: var(--accent);
    }

    .played-section {
      display: none;
      border-top: 1px solid var(--border);
      margin: 0 1rem;
      padding-top: 1rem;
    }
    .played-section.visible { display: block; }
    .played-section .set-grid { padding: 0.75rem 0 1.5rem; }
    .played-header {
      font-family: 'Syne', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-2);
      padding: 0 0.25rem;
    }
    @media (min-width: 860px) {
      .played-section { max-width: 900px; margin: 0 auto; padding-top: 1rem; }
    }

    #set-grid-container { flex: 1; }
    .category-section .set-grid { padding-top: 0.5rem; }
    .category-section.collapsed .set-grid { display: none; }
    .category-header {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-family: 'Syne', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-2);
      padding: 1rem 1rem 0;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .category-header:hover { color: var(--text); }
    .category-chevron {
      display: inline-block;
      font-size: 0.65rem;
      transform: rotate(90deg);
      transition: transform 0.15s;
    }
    .category-section.collapsed .category-chevron { transform: rotate(0deg); }
    @media (min-width: 560px) {
      .category-header { padding-left: 1.5rem; padding-right: 1.5rem; }
    }
    @media (min-width: 860px) {
      .category-header { max-width: 900px; margin: 0 auto; padding-left: 0; padding-right: 0; }
    }

    .played-section .category-header {
      padding: 0.75rem 0.25rem 0;
    }
    @media (min-width: 560px) {
      .played-section .category-header { padding-left: 0.25rem; padding-right: 0.25rem; }
    }
    @media (min-width: 860px) {
      .played-section .category-header { max-width: none; margin: 0; padding-left: 0.25rem; padding-right: 0.25rem; }
    }

    /* ── QUIZ VIEW ── */
    #view-quiz {
      display: none;
      flex-direction: column;
      height: 100svh;
      overflow: hidden;
    }
    #view-quiz.visible { display: flex; }

    /* Header bar */
    .quiz-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px; height: 36px;
      border: 1.5px solid var(--border);
      background: transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text);
      font-size: 1.1rem;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .back-btn:hover { background: var(--surface); }
    .shuffle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px; height: 36px;
      border: 1.5px solid var(--border);
      background: transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    .shuffle-btn:hover { background: var(--surface); }
    .shuffle-btn.active {
      background: var(--accent-bg);
      border-color: var(--accent);
    }
    .set-pill {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.75rem;
      background: var(--accent-bg);
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent-dk);
      flex: 1;
      min-width: 0;
    }
    .set-pill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .q-counter {
      flex-shrink: 0;
      font-family: 'Syne', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-2);
    }

    /* Progress bar */
    .progress-track {
      flex-shrink: 0;
      height: 3px;
      background: var(--border);
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.4s ease;
    }

    /* Question area */
    .question-area {
      flex: 1;
      overflow-y: auto;
      padding: 1.75rem 1.25rem 1rem;
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 640px) {
      .question-area { padding: 2.5rem 2rem 1.5rem; max-width: 680px; margin: 0 auto; width: 100%; }
    }

    .q-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }
    .q-text {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.35rem, 4.5vw, 1.9rem);
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.01em;
      color: var(--text);
      flex-grow: 1;
    }

    /* Hint */
    .hint-wrap { margin-top: 1.5rem; }
    .hint-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.9rem;
      border: 1.5px solid var(--border);
      background: transparent;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--hint);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .hint-btn:hover { background: var(--hint-bg); border-color: var(--hint); }
    .hint-text {
      display: none;
      margin-top: 0.65rem;
      padding: 0.75rem 1rem;
      background: var(--hint-bg);
      border-left: 3px solid var(--hint);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: 0.92rem;
      color: var(--hint);
      animation: fadeUp 0.2s ease;
    }
    .hint-text.visible { display: block; }

    /* Answer panel */
    .answer-panel {
      display: none;
      margin-top: 1.5rem;
      padding: 1.25rem;
      background: var(--answer-bg);
      border: 1.5px solid #a7f3d0;
      border-radius: var(--radius);
      animation: fadeUp 0.3s ease;
    }
    .answer-panel.visible { display: block; }
    .answer-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--answer);
      margin-bottom: 0.5rem;
    }
    .answer-text {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.1rem, 3.5vw, 1.4rem);
      font-weight: 700;
      color: var(--answer);
      line-height: 1.25;
      margin-bottom: 0.65rem;
    }
    .answer-explanation {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #065f46;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Bottom action bar */
    .action-bar {
      flex-shrink: 0;
      padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    @media (min-width: 640px) {
      .action-bar { padding: 1rem 2rem calc(1rem + env(safe-area-inset-bottom)); }
    }

    .nav-arrow {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px; height: 44px;
      border: 1.5px solid var(--border);
      background: transparent;
      border-radius: var(--radius-sm);
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--text);
      transition: background 0.15s, border-color 0.15s;
    }
    .nav-arrow:hover:not(:disabled) { background: var(--surface); border-color: var(--text); }
    .nav-arrow:disabled { opacity: 0.25; cursor: default; }

    .reveal-btn {
      flex: 1;
      height: 44px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'Syne', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .reveal-btn:hover { background: var(--accent-dk); }
    .reveal-btn:active { transform: scale(0.98); }
    .reveal-btn.revealed {
      background: var(--surface);
      color: var(--text-2);
      border: 1.5px solid var(--border);
    }

    /* ── SETUP VIEW ── */
    #view-setup {
      display: none;
      flex-direction: column;
      height: 100svh;
      overflow: hidden;
    }
    #view-setup.visible { display: flex; }

    .setup-area {
      flex: 1;
      overflow-y: auto;
      padding: 1.75rem 1.25rem 1.5rem;
    }
    @media (min-width: 640px) {
      .setup-area { max-width: 520px; margin: 0 auto; width: 100%; padding: 2.5rem 2rem 2rem; }
    }

    .setup-section { margin-bottom: 1.75rem; }
    .setup-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-2);
      margin-bottom: 0.65rem;
    }

    .mode-toggle { display: flex; flex-direction: column; gap: 0.6rem; }
    @media (min-width: 420px) {
      .mode-toggle { flex-direction: row; }
    }
    .mode-btn {
      flex: 1;
      padding: 0.85rem 1rem;
      border: 1.5px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-sm);
      font-family: 'Syne', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      text-align: center;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    .mode-btn.active {
      border-color: var(--accent);
      background: var(--accent-bg);
      color: var(--accent-dk);
    }
    .mode-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .mode-hint {
      margin-top: 0.5rem;
      font-size: 0.78rem;
      color: var(--text-2);
    }

    .player-input-row { display: flex; gap: 0.5rem; }
    #player-name-input {
      flex: 1;
      height: 44px;
      padding: 0 0.9rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--bg);
    }
    #player-name-input:focus { outline: none; border-color: var(--accent); }
    .add-player-btn {
      flex-shrink: 0;
      width: 44px; height: 44px;
      border: none;
      background: var(--accent);
      color: #fff;
      border-radius: var(--radius-sm);
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
    }
    .add-player-btn:hover { background: var(--accent-dk); }

    .player-chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.85rem;
    }
    .player-chip {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.4rem 0.5rem 0.4rem 0.85rem;
      background: var(--accent-bg);
      color: var(--accent-dk);
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .player-chip button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px; height: 20px;
      border: none;
      background: rgba(99,102,241,0.15);
      color: var(--accent-dk);
      border-radius: 999px;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .player-chip button:hover { background: rgba(99,102,241,0.3); }

    .setup-warning {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: #b91c1c;
      min-height: 1.1em;
    }

    .setup-actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }
    .skip-link {
      background: none;
      border: none;
      color: var(--text-2);
      font-size: 0.82rem;
      text-decoration: underline;
      cursor: pointer;
      padding: 0.4rem;
    }
    .skip-link:hover { color: var(--text); }

    /* ── SCOREBOARD STRIP ── */
    #scoreboard-strip {
      display: none;
      flex-shrink: 0;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .score-pill {
      flex-shrink: 0;
      padding: 0.25rem 0.65rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-2);
      white-space: nowrap;
    }
    .score-pill b { color: var(--accent-dk); }

    /* ── MULTIPLE CHOICE ── */
    .choices-wrap {
      display: none;
      grid-template-columns: 1fr;
      gap: 0.6rem;
      margin-top: 1.5rem;
    }
    @media (min-width: 420px) {
      .choices-wrap { grid-template-columns: 1fr 1fr; }
    }
    .choice-btn {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.75rem 0.9rem;
      border: 1.5px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text);
    }
    .choice-btn.choice-correct {
      border-color: var(--answer);
      background: var(--answer-bg);
      color: var(--answer);
      font-weight: 700;
    }
    .choice-letter {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px; height: 24px;
      border-radius: 999px;
      background: var(--border);
      color: var(--text-2);
      font-family: 'Syne', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .choice-correct .choice-letter { background: var(--answer); color: #fff; }

    /* ── SCORING PANEL ── */
    .scoring-panel {
      display: none;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #a7f3d0;
    }
    .scoring-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--answer);
      margin-bottom: 0.6rem;
    }
    .scoring-chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .scoring-chip {
      padding: 0.4rem 0.85rem;
      border: 1.5px solid #a7f3d0;
      background: var(--bg);
      color: var(--answer);
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .scoring-chip.selected {
      background: var(--answer);
      color: #fff;
      border-color: var(--answer);
    }

    /* ── SUMMARY VIEW ── */
    #view-summary {
      display: none;
      align-items: center;
      justify-content: center;
      height: 100svh;
      padding: 1.5rem;
    }
    #view-summary.visible { display: flex; }
    .summary-content {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .summary-emoji { font-size: 3rem; margin-bottom: 0.75rem; }
    .summary-content h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 1.5rem;
    }
    .summary-ranking {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }
    .ranking-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      font-weight: 600;
      color: var(--text);
    }
    .ranking-row--winner {
      border-color: var(--accent);
      background: var(--accent-bg);
      color: var(--accent-dk);
    }
    .summary-actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    /* ── LOADING / ERROR ── */
    .loading {
      height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-2);
      font-size: 0.95rem;
    }

    /* ── UPDATE BANNER ── */
    .update-banner {
      display: none;
      position: fixed;
      left: 1rem;
      right: 1rem;
      bottom: calc(1rem + env(safe-area-inset-bottom));
      z-index: 100;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.75rem 0.75rem 0.75rem 1rem;
      background: var(--text);
      color: #fff;
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(15,23,42,0.25);
      animation: fadeUp 0.3s ease;
    }
    .update-banner.visible { display: flex; }
    .update-banner span { font-size: 0.88rem; font-weight: 500; }
    .update-banner button {
      flex-shrink: 0;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.5rem 0.9rem;
      border-radius: var(--radius-sm);
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .update-banner button:hover { background: var(--accent-dk); }
    @media (min-width: 640px) {
      .update-banner { max-width: 420px; left: auto; right: 1.5rem; bottom: 1.5rem; }
    }
  </style>
</head>
<body>

<!-- SELECTOR -->
<div id="view-selector">
  <div class="selector-header">
    <div class="logo">🎯</div>
    <h1>Schätzfragen</h1>
    <p>Wähle ein Set und los geht's</p>
  </div>
  <div id="set-grid-container">
    <div class="loading">Lade Sets…</div>
  </div>

  <div class="played-section" id="played-section">
    <div class="played-header">Bereits gespielt</div>
    <div id="played-grid-container"></div>
  </div>
</div>

<div class="update-banner" id="update-banner">
  <span>🔄 Neue Version verfügbar</span>
  <button id="update-btn" onclick="applyUpdate()">Neu laden</button>
</div>

<div class="update-banner" id="undo-toast">
  <span id="undo-toast-text"></span>
  <button id="undo-btn">Rückgängig</button>
</div>

<!-- SETUP -->
<div id="view-setup">
  <div class="quiz-bar">
    <button class="back-btn" onclick="cancelSetup()" title="Zurück zur Auswahl">←</button>
    <div class="set-pill">
      <span id="setup-emoji"></span>
      <span id="setup-title"></span>
    </div>
  </div>

  <div class="setup-area">
    <div class="setup-section">
      <div class="setup-label">Spielmodus</div>
      <div class="mode-toggle">
        <button class="mode-btn" id="mode-free-btn" onclick="selectMode('free')">🗣️ Frei</button>
        <button class="mode-btn" id="mode-choices-btn" onclick="selectMode('choices')">🔢 Mit Antwortmöglichkeiten</button>
      </div>
      <div class="mode-hint" id="mode-choices-hint"></div>
    </div>

    <div class="setup-section">
      <div class="setup-label">Mitspieler</div>
      <div class="player-input-row">
        <input type="text" id="player-name-input" placeholder="Name eingeben…" maxlength="24" autocomplete="off"
          onkeydown="if(event.key==='Enter'){event.preventDefault();addPlayerFromInput();}" />
        <button class="add-player-btn" onclick="addPlayerFromInput()" title="Hinzufügen">+</button>
      </div>
      <div class="player-chip-list" id="player-chip-list"></div>
      <div class="setup-warning" id="player-warning"></div>
    </div>

    <div class="setup-actions">
      <button class="reveal-btn" id="start-round-btn" onclick="startRound()" disabled>Runde starten</button>
      <button class="skip-link" onclick="startWithoutPlayers()">Ohne Mitspieler einfach durchklicken</button>
    </div>
  </div>
</div>

<!-- QUIZ -->
<div id="view-quiz">
  <div class="quiz-bar">
    <button class="back-btn" onclick="showSelector()" title="Zurück zur Auswahl">←</button>
    <div class="set-pill">
      <span id="bar-emoji"></span>
      <span id="bar-title"></span>
    </div>
    <button class="shuffle-btn" id="shuffle-btn" onclick="toggleShuffle()" title="Reihenfolge mischen">🔀</button>
    <div class="q-counter" id="q-counter">1 / 7</div>
  </div>

  <div class="progress-track">
    <div class="progress-fill" id="progress-fill" style="width:0%"></div>
  </div>

  <div id="scoreboard-strip"></div>

  <div class="question-area" id="question-area">
    <div class="q-label" id="q-label">Frage 1</div>
    <div class="q-text" id="q-text"></div>

    <div class="choices-wrap" id="choices-wrap"></div>

    <div class="hint-wrap">
      <button class="hint-btn" id="hint-btn" onclick="revealHint()">💡 Hinweis</button>
      <div class="hint-text" id="hint-text"></div>
    </div>

    <div class="answer-panel" id="answer-panel">
      <div class="answer-label">Antwort</div>
      <div class="answer-text" id="answer-text"></div>
      <div class="answer-explanation" id="answer-explanation"></div>

      <div class="scoring-panel" id="scoring-panel">
        <div class="scoring-label" id="scoring-label">Wer war am nächsten dran?</div>
        <div class="scoring-chip-list" id="scoring-chip-list"></div>
      </div>
    </div>
  </div>

  <div class="action-bar">
    <button class="nav-arrow" id="prev-btn" onclick="navigate(-1)" title="Zurück">←</button>
    <button class="reveal-btn" id="reveal-btn" onclick="revealAnswer()">Antwort aufdecken</button>
    <button class="nav-arrow" id="next-btn" onclick="navigate(1)" title="Weiter">→</button>
  </div>
</div>

<!-- SUMMARY -->
<div id="view-summary">
  <div class="summary-content">
    <div class="summary-emoji">🏆</div>
    <h2 id="summary-winner-text"></h2>
    <div class="summary-ranking" id="summary-ranking"></div>
    <div class="summary-actions">
      <button class="reveal-btn" onclick="restartRoundSamePlayers()">🔁 Neue Runde, gleiches Set</button>
      <button class="skip-link" onclick="finishRound()">Zur Set-Auswahl</button>
    </div>
  </div>
</div>

<script>
  let sets = [], activeSet = null, currentIndex = 0, revealed = {};
  let activeOrder = [], shuffleActive = false;

  const STORAGE_KEY = 'schaetzfragen_revealed_v1';
  const COLLAPSE_KEY = 'schaetzfragen_collapsed_categories_v1';
  const ROUND_KEY = 'schaetzfragen_round_v1';
  const CATEGORY_ORDER = ['Städte & Orte', 'Länder & Kultur', 'Geschichte', 'Tiere & Natur', 'Kurioses & Rekorde'];
  let collapsedCategories = new Set();

  // Rundenzustand: Mitspieler + Punkte gelten nur für die aktuell laufende Runde
  // eines Sets (nicht dauerhaft wie der "revealed"-Fortschritt).
  let roundActive = false;       // false = "frei durchklicken" ohne Spieler/Scoring
  let roundMode = 'free';        // 'free' | 'choices'
  let roundPlayers = [];         // Namen, nur für diese Runde
  let roundScorers = {};         // { realIndex: [playerName, ...] } — wer war am nächsten/richtig
  let roundChoiceOrder = {};     // { realIndex: [choice, ...] } — geshuffelte Reihenfolge pro Frage

  // Setup-View: Zwischenstand bevor eine Runde tatsächlich gestartet wird
  let pendingSetupSet = null;
  let setupMode = 'free';
  let setupPlayers = [];

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function loadCollapsedCategories() {
    try { return new Set(JSON.parse(localStorage.getItem(COLLAPSE_KEY) || '[]')); }
    catch (e) { return new Set(); }
  }

  function saveCollapsedCategories() {
    try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...collapsedCategories])); } catch (e) {}
  }

  function toggleCategory(key) {
    if (collapsedCategories.has(key)) collapsedCategories.delete(key);
    else collapsedCategories.add(key);
    saveCollapsedCategories();
    renderGrid();
  }

  function loadProgress() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      const out = {};
      Object.keys(raw).forEach(id => { out[id] = new Set(raw[id]); });
      return out;
    } catch (e) { return {}; }
  }

  function saveProgress() {
    const raw = {};
    Object.keys(revealed).forEach(id => { raw[id] = Array.from(revealed[id]); });
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(raw)); } catch (e) {}
  }

  function isSetPlayed(set) {
    const rev = revealed[set.id];
    return !!rev && rev.size === set.questions.length;
  }

  let undoTimer = null;

  function showUndoToast(set, backupRevealedSet, wasMarkedPlayed) {
    clearTimeout(undoTimer);
    const toast = document.getElementById('undo-toast');
    document.getElementById('undo-toast-text').textContent =
      wasMarkedPlayed ? `"${set.title}" als gespielt markiert` : `"${set.title}" zurückgesetzt`;
    toast.classList.add('visible');

    const undoBtn = document.getElementById('undo-btn');
    undoBtn.onclick = () => {
      if (backupRevealedSet) revealed[set.id] = backupRevealedSet;
      else delete revealed[set.id];
      saveProgress();
      renderGrid();
      toast.classList.remove('visible');
      clearTimeout(undoTimer);
    };

    undoTimer = setTimeout(() => toast.classList.remove('visible'), 5000);
  }

  async function init() {
    revealed = loadProgress();
    collapsedCategories = loadCollapsedCategories();
    try {
      const files = await fetch('questions/index.json').then(r => r.json());
      sets = await Promise.all(files.map(f => fetch('questions/' + f).then(r => r.json())));
      renderGrid();
      tryRestoreRound();
    } catch (e) {
      document.getElementById('set-grid-container').innerHTML =
        '<div class="loading">⚠️ Bitte lokalen Server starten (z.B. npx serve).</div>';
    }
  }

  function makeSetCard(set, played) {
    const card = document.createElement('div');
    card.className = 'set-card' + (played ? ' set-card--played' : '');
    card.setAttribute('role', 'button');
    card.tabIndex = 0;
    const rev = (revealed[set.id] || new Set()).size;
    const total = set.questions.length;
    const statusText = played
      ? '✓ Gespielt'
      : (rev > 0 ? `${rev}/${total} begonnen` : `${total} Fragen`);
    card.innerHTML = `
      <div class="card-emoji">${set.emoji}</div>
      <div class="card-title">${set.title}</div>
      <div class="card-count">${statusText}</div>`;
    card.onclick = () => openSetup(set);
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSetup(set); }
    });

    if (played) {
      const resetBtn = document.createElement('button');
      resetBtn.className = 'set-reset-btn';
      resetBtn.title = 'Als ungespielt markieren';
      resetBtn.setAttribute('aria-label', 'Als ungespielt markieren');
      resetBtn.textContent = '↺';
      resetBtn.onclick = (e) => {
        e.stopPropagation();
        const backup = revealed[set.id];
        revealed[set.id] = new Set();
        saveProgress();
        renderGrid();
        showUndoToast(set, backup);
      };
      card.appendChild(resetBtn);
    } else {
      const markPlayedBtn = document.createElement('button');
      markPlayedBtn.className = 'set-reset-btn';
      markPlayedBtn.title = 'Als gespielt markieren';
      markPlayedBtn.setAttribute('aria-label', 'Als gespielt markieren');
      markPlayedBtn.textContent = '✓';
      markPlayedBtn.onclick = (e) => {
        e.stopPropagation();
        const backup = revealed[set.id];
        revealed[set.id] = new Set(set.questions.map((_, i) => i));
        saveProgress();
        renderGrid();
        showUndoToast(set, backup, true);
      };
      card.appendChild(markPlayedBtn);
    }

    return card;
  }

  // Rendert eine Liste von Sets gruppiert nach Kategorie (feste Reihenfolge zuerst,
  // unbekannte Kategorien danach) in den übergebenen Container. Jede Kategorie ist
  // über ihren Header ein-/ausklappbar. Der Zustand wird pro Bereich (offen/gespielt)
  // getrennt gespeichert, damit das Zuklappen einer Kategorie im einen Bereich nicht
  // dieselbe Kategorie im anderen Bereich mit zuklappt.
  function renderCategorizedSets(container, list, played) {
    container.innerHTML = '';

    const byCategory = new Map();
    list.forEach(set => {
      const cat = set.category || 'Sonstiges';
      if (!byCategory.has(cat)) byCategory.set(cat, []);
      byCategory.get(cat).push(set);
    });

    const orderedCategories = [
      ...CATEGORY_ORDER.filter(cat => byCategory.has(cat)),
      ...[...byCategory.keys()].filter(cat => !CATEGORY_ORDER.includes(cat)),
    ];

    orderedCategories.forEach(cat => {
      const collapseKey = (played ? 'played:' : 'unplayed:') + cat;
      const isCollapsed = collapsedCategories.has(collapseKey);

      const section = document.createElement('div');
      section.className = 'category-section' + (isCollapsed ? ' collapsed' : '');

      const header = document.createElement('div');
      header.className = 'category-header';
      header.setAttribute('role', 'button');
      header.tabIndex = 0;
      header.setAttribute('aria-expanded', String(!isCollapsed));
      header.innerHTML = `<span class="category-chevron">▸</span><span>${cat}</span>`;
      header.onclick = () => toggleCategory(collapseKey);
      header.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleCategory(collapseKey); }
      });
      section.appendChild(header);

      const grid = document.createElement('div');
      grid.className = 'set-grid';
      byCategory.get(cat).forEach(set => grid.appendChild(makeSetCard(set, played)));
      section.appendChild(grid);

      container.appendChild(section);
    });
  }

  function renderGrid() {
    const container = document.getElementById('set-grid-container');
    const playedContainer = document.getElementById('played-grid-container');
    const playedSection = document.getElementById('played-section');

    // Reihenfolge = index.json-Reihenfolge, getrennt nach gespielt/ungespielt
    const played = [];
    const unplayed = [];
    sets.forEach(set => {
      if (isSetPlayed(set)) {
        played.push(set);
      } else {
        unplayed.push(set);
      }
    });

    renderCategorizedSets(playedContainer, played, true);
    playedSection.classList.toggle('visible', played.length > 0);

    // Alles durchgespielt? Freundlicher Hinweis statt leerer Fläche.
    if (sets.length > 0 && played.length === sets.length) {
      container.innerHTML = `
        <div class="all-played-msg">
          <div class="all-played-emoji">🎉</div>
          <div>Alle Sets gespielt!</div>
          <div class="all-played-sub">Setz eins unten auf "ungespielt", um es erneut zu spielen.</div>
        </div>`;
      return;
    }

    renderCategorizedSets(container, unplayed, false);
  }

  function showSelector() {
    if (roundActive && document.getElementById('view-quiz').classList.contains('visible')) {
      if (!confirm('Runde abbrechen? Der Punktestand geht verloren.')) return;
    }
    clearRoundState();
    document.getElementById('view-selector').classList.remove('hidden');
    document.getElementById('view-quiz').classList.remove('visible');
    document.getElementById('view-summary').classList.remove('visible');
    renderGrid(); // refresh counts
    window.scrollTo({ top: 0 });
  }

  // ── SETUP: Modus + Mitspieler vor Rundenstart ──

  function openSetup(set) {
    pendingSetupSet = set;
    setupMode = 'free';
    setupPlayers = [];

    document.getElementById('setup-emoji').textContent = set.emoji;
    document.getElementById('setup-title').textContent = set.title;

    const allHaveChoices = set.questions.every(q => Array.isArray(q.choices) && q.choices.length === 4 && q.correctChoice);
    const choicesBtn = document.getElementById('mode-choices-btn');
    choicesBtn.disabled = !allHaveChoices;
    document.getElementById('mode-choices-hint').textContent = allHaveChoices
      ? ''
      : 'Für dieses Set noch nicht verfügbar — nicht alle Fragen haben Antwortoptionen.';

    selectMode('free');
    document.getElementById('player-name-input').value = '';
    document.getElementById('player-warning').textContent = '';
    renderPlayerChips();

    document.getElementById('view-selector').classList.add('hidden');
    document.getElementById('view-setup').classList.add('visible');
  }

  function cancelSetup() {
    pendingSetupSet = null;
    document.getElementById('view-setup').classList.remove('visible');
    document.getElementById('view-selector').classList.remove('hidden');
  }

  function selectMode(mode) {
    setupMode = mode;
    document.getElementById('mode-free-btn').classList.toggle('active', mode === 'free');
    document.getElementById('mode-choices-btn').classList.toggle('active', mode === 'choices');
  }

  function renderPlayerChips() {
    const list = document.getElementById('player-chip-list');
    list.innerHTML = '';
    setupPlayers.forEach((name, i) => {
      const chip = document.createElement('div');
      chip.className = 'player-chip';
      chip.innerHTML = `<span>${escapeHtml(name)}</span>`;
      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.textContent = '✕';
      removeBtn.setAttribute('aria-label', `${name} entfernen`);
      removeBtn.onclick = () => { setupPlayers.splice(i, 1); renderPlayerChips(); };
      chip.appendChild(removeBtn);
      list.appendChild(chip);
    });
    document.getElementById('start-round-btn').disabled = setupPlayers.length < 2;
  }

  function addPlayerFromInput() {
    const input = document.getElementById('player-name-input');
    const warning = document.getElementById('player-warning');
    const name = input.value.trim();
    warning.textContent = '';
    if (!name) return;
    if (setupPlayers.some(p => p.toLowerCase() === name.toLowerCase())) {
      warning.textContent = `"${name}" ist schon dabei.`;
      return;
    }
    setupPlayers.push(name);
    input.value = '';
    renderPlayerChips();
    input.focus();
  }

  function startRound() {
    if (setupPlayers.length < 2 || !pendingSetupSet) return;
    beginQuiz(pendingSetupSet, { active: true, mode: setupMode, players: setupPlayers.slice() });
  }

  function startWithoutPlayers() {
    if (!pendingSetupSet) return;
    beginQuiz(pendingSetupSet, { active: false, mode: 'free', players: [] });
  }

  function beginQuiz(set, round) {
    activeSet = set;
    currentIndex = 0;
    activeOrder = set.questions.map((_, i) => i);
    shuffleActive = false;
    document.getElementById('shuffle-btn').classList.remove('active');
    if (!revealed[set.id]) revealed[set.id] = new Set();

    roundActive = round.active;
    roundMode = round.mode;
    roundPlayers = round.players;
    roundScorers = {};
    roundChoiceOrder = {};
    saveRoundState();

    pendingSetupSet = null;
    document.getElementById('view-setup').classList.remove('visible');
    document.getElementById('view-selector').classList.add('hidden');
    document.getElementById('view-summary').classList.remove('visible');
    document.getElementById('view-quiz').classList.add('visible');
    renderQuestion();
  }

  // ── Rundenzustand persistieren (sessionStorage — nur für die aktuelle Browser-Session,
  // damit ein versehentlicher Reload mitten in der Runde Mitspieler/Punkte nicht verliert,
  // die Runde aber nicht wie Fragensets dauerhaft überlebt) ──

  function saveRoundState() {
    if (!roundActive || !activeSet) return;
    const raw = {
      setId: activeSet.id,
      mode: roundMode,
      players: roundPlayers,
      scorers: roundScorers,
      currentIndex,
      activeOrder,
      shuffleActive,
    };
    try { sessionStorage.setItem(ROUND_KEY, JSON.stringify(raw)); } catch (e) {}
  }

  function clearRoundState() {
    roundActive = false;
    roundMode = 'free';
    roundPlayers = [];
    roundScorers = {};
    roundChoiceOrder = {};
    try { sessionStorage.removeItem(ROUND_KEY); } catch (e) {}
  }

  function tryRestoreRound() {
    let raw;
    try { raw = JSON.parse(sessionStorage.getItem(ROUND_KEY) || 'null'); } catch (e) { return; }
    if (!raw) return;
    const set = sets.find(s => s.id === raw.setId);
    if (!set || !Array.isArray(raw.players) || raw.players.length < 2) {
      try { sessionStorage.removeItem(ROUND_KEY); } catch (e) {}
      return;
    }

    activeSet = set;
    activeOrder = (Array.isArray(raw.activeOrder) && raw.activeOrder.length === set.questions.length)
      ? raw.activeOrder
      : set.questions.map((_, i) => i);
    currentIndex = Math.min(Math.max(raw.currentIndex || 0, 0), activeOrder.length - 1);
    shuffleActive = !!raw.shuffleActive;
    document.getElementById('shuffle-btn').classList.toggle('active', shuffleActive);
    if (!revealed[set.id]) revealed[set.id] = new Set();

    roundActive = true;
    roundMode = raw.mode === 'choices' ? 'choices' : 'free';
    roundPlayers = raw.players;
    roundScorers = raw.scorers && typeof raw.scorers === 'object' ? raw.scorers : {};
    roundChoiceOrder = {};

    document.getElementById('view-selector').classList.add('hidden');
    document.getElementById('view-quiz').classList.add('visible');
    renderQuestion();
  }

  function shuffleArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function toggleShuffle() {
    shuffleActive = !shuffleActive;
    activeOrder = shuffleActive
      ? shuffleArray(activeSet.questions.map((_, i) => i))
      : activeSet.questions.map((_, i) => i);
    currentIndex = 0;
    document.getElementById('shuffle-btn').classList.toggle('active', shuffleActive);
    saveRoundState();
    renderQuestion();
  }

  function computeScores() {
    const scores = {};
    roundPlayers.forEach(p => { scores[p] = 0; });
    Object.values(roundScorers).forEach(names => {
      names.forEach(name => { if (scores[name] !== undefined) scores[name]++; });
    });
    return scores;
  }

  function renderScoreboard() {
    const strip = document.getElementById('scoreboard-strip');
    if (!roundActive) { strip.style.display = 'none'; return; }
    const scores = computeScores();
    const sorted = roundPlayers.slice().sort((a, b) => scores[b] - scores[a]);
    strip.innerHTML = sorted.map(name =>
      `<span class="score-pill">${escapeHtml(name)} <b>${scores[name]}</b></span>`).join('');
    strip.style.display = 'flex';
  }

  function renderChoices(q, realIndex, isRevealed) {
    const wrap = document.getElementById('choices-wrap');
    const show = roundMode === 'choices' && Array.isArray(q.choices) && q.choices.length === 4;
    if (!show) { wrap.style.display = 'none'; wrap.innerHTML = ''; return; }

    if (!roundChoiceOrder[realIndex]) {
      roundChoiceOrder[realIndex] = shuffleArray(q.choices);
    }
    const letters = ['A', 'B', 'C', 'D'];
    wrap.innerHTML = roundChoiceOrder[realIndex].map((choice, i) => {
      const correct = isRevealed && choice === q.correctChoice;
      return `<div class="choice-btn${correct ? ' choice-correct' : ''}">
        <span class="choice-letter">${letters[i]}</span><span>${escapeHtml(choice)}</span>
      </div>`;
    }).join('');
    wrap.style.display = 'grid';
  }

  function renderScoringPanel(realIndex, isRevealed) {
    const panel = document.getElementById('scoring-panel');
    if (!roundActive || !isRevealed) { panel.style.display = 'none'; return; }

    document.getElementById('scoring-label').textContent =
      roundMode === 'choices' ? 'Wer hat richtig getippt?' : 'Wer war am nächsten dran?';

    const selected = new Set(roundScorers[realIndex] || []);
    const list = document.getElementById('scoring-chip-list');
    list.innerHTML = '';
    roundPlayers.forEach(name => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'scoring-chip' + (selected.has(name) ? ' selected' : '');
      chip.textContent = name;
      chip.onclick = () => toggleScorer(realIndex, name);
      list.appendChild(chip);
    });
    panel.style.display = 'block';
  }

  function toggleScorer(realIndex, name) {
    const arr = roundScorers[realIndex] ? roundScorers[realIndex].slice() : [];
    const idx = arr.indexOf(name);
    if (idx === -1) arr.push(name); else arr.splice(idx, 1);
    roundScorers[realIndex] = arr;
    saveRoundState();
    renderQuestion();
  }

  function renderQuestion() {
    const realIndex = activeOrder[currentIndex];
    const q     = activeSet.questions[realIndex];
    const total = activeSet.questions.length;
    const rev   = revealed[activeSet.id];
    const isRevealed = rev.has(realIndex);

    // Bar
    document.getElementById('bar-emoji').textContent = activeSet.emoji;
    document.getElementById('bar-title').textContent = activeSet.title;
    document.getElementById('q-counter').textContent = `${currentIndex + 1} / ${total}`;

    // Progress: fraction of questions revealed
    const pct = Math.round((rev.size / total) * 100);
    document.getElementById('progress-fill').style.width = pct + '%';

    // Question
    document.getElementById('q-label').textContent = `Frage ${currentIndex + 1}`;
    document.getElementById('q-text').textContent  = q.question;

    renderScoreboard();
    renderChoices(q, realIndex, isRevealed);

    // Hint — always reset
    document.getElementById('hint-text').textContent = q.hint;
    document.getElementById('hint-text').classList.remove('visible');
    document.getElementById('hint-btn').style.display = 'inline-flex';

    // Answer
    document.getElementById('answer-text').textContent        = q.answer;
    document.getElementById('answer-explanation').textContent = q.explanation;
    document.getElementById('answer-panel').classList.toggle('visible', isRevealed);
    renderScoringPanel(realIndex, isRevealed);

    // Reveal button
    const revBtn = document.getElementById('reveal-btn');
    if (isRevealed) {
      revBtn.textContent = '✓ Aufgedeckt';
      revBtn.classList.add('revealed');
    } else {
      revBtn.textContent = 'Antwort aufdecken';
      revBtn.classList.remove('revealed');
    }

    // Nav
    document.getElementById('prev-btn').disabled = currentIndex === 0;
    const isLast = currentIndex === total - 1;
    const nextBtn = document.getElementById('next-btn');
    nextBtn.disabled = false;
    nextBtn.textContent = isLast ? '🏠' : '→';
    nextBtn.title = isLast ? 'Zur Startseite' : 'Weiter';

    // Scroll top
    document.getElementById('question-area').scrollTo({ top: 0 });
  }

  function revealHint() {
    document.getElementById('hint-text').classList.add('visible');
    document.getElementById('hint-btn').style.display = 'none';
  }

  function revealAnswer() {
    const rev = revealed[activeSet.id];
    const realIndex = activeOrder[currentIndex];
    if (rev.has(realIndex)) return;
    rev.add(realIndex);
    saveProgress();
    saveRoundState();
    if ('vibrate' in navigator) { try { navigator.vibrate(35); } catch (e) {} }
    renderQuestion();
  }

  function navigate(dir) {
    if (dir === 1 && currentIndex === activeOrder.length - 1) {
      if (roundActive) showRoundSummary();
      else showSelector();
      return;
    }
    const next = currentIndex + dir;
    if (next >= 0 && next < activeOrder.length) {
      currentIndex = next;
      saveRoundState();
      renderQuestion();
    }
  }

  // ── Rundenabschluss ──

  function showRoundSummary() {
    const scores = computeScores();
    const maxScore = Math.max(0, ...roundPlayers.map(p => scores[p]));
    const winners = roundPlayers.filter(p => scores[p] === maxScore);
    const sorted = roundPlayers.slice().sort((a, b) => scores[b] - scores[a]);

    document.getElementById('summary-winner-text').textContent = maxScore === 0
      ? 'Niemand hat gepunktet'
      : (winners.length > 1 ? `Unentschieden: ${winners.join(' & ')}!` : `${winners[0]} gewinnt! 🎉`);

    document.getElementById('summary-ranking').innerHTML = sorted.map((name, i) => `
      <div class="ranking-row${winners.includes(name) && maxScore > 0 ? ' ranking-row--winner' : ''}">
        <span>${i + 1}. ${escapeHtml(name)}</span><span>${scores[name]} Pkt.</span>
      </div>`).join('');

    document.getElementById('view-quiz').classList.remove('visible');
    document.getElementById('view-summary').classList.add('visible');
  }

  function restartRoundSamePlayers() {
    const set = activeSet;
    const players = roundPlayers.slice();
    const mode = roundMode;
    document.getElementById('view-summary').classList.remove('visible');
    beginQuiz(set, { active: true, mode, players });
  }

  function finishRound() {
    document.getElementById('view-summary').classList.remove('visible');
    clearRoundState();
    showSelector();
  }

  // Wake Lock
  let wakeLock = null;
  async function requestWakeLock() {
    if ('wakeLock' in navigator) {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') requestWakeLock();
  });
  requestWakeLock();

  // Service Worker — Update-Banner statt hartem Reload
  let swRegistration = null;

  function showUpdateBanner() {
    document.getElementById('update-banner').classList.add('visible');
  }

  function applyUpdate() {
    if (swRegistration && swRegistration.waiting) {
      swRegistration.waiting.postMessage('SKIP_WAITING');
    }
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(reg => {
        swRegistration = reg;

        // Falls beim Laden schon eine Version wartet (z.B. Tab war offen)
        if (reg.waiting) showUpdateBanner();

        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          if (!newWorker) return;
          newWorker.addEventListener('statechange', () => {
            // 'installed' + bereits ein aktiver Controller = echtes Update (nicht Erstinstallation)
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdateBanner();
            }
          });
        });
      }).catch(() => {});
    });

    // Neuer SW hat die Kontrolle übernommen (nach Klick auf "Neu laden") → jetzt reloaden
    let refreshedAfterUpdate = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshedAfterUpdate) return;
      refreshedAfterUpdate = true;
      window.location.reload();
    });
  }

  // Swipe-Gesten (Wischen links/rechts = vor/zurück)
  (function setupSwipe() {
    const area = document.getElementById('question-area');
    let startX = 0, startY = 0, tracking = false;

    area.addEventListener('touchstart', (e) => {
      const t = e.changedTouches[0];
      startX = t.clientX;
      startY = t.clientY;
      tracking = true;
    }, { passive: true });

    area.addEventListener('touchend', (e) => {
      if (!tracking) return;
      tracking = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - startX;
      const dy = t.clientY - startY;
      const THRESHOLD_H = 55;
      const THRESHOLD_V = 60;
      // Horizontal = vor/zurück. Nur werten wenn deutlich horizontaler als vertikaler Swipe.
      if (Math.abs(dx) > THRESHOLD_H && Math.abs(dx) > Math.abs(dy) * 1.5) {
        navigate(dx < 0 ? 1 : -1);
        return;
      }
      // Hochwischen (dy < 0) = Antwort aufdecken. Nur werten wenn deutlich vertikaler als horizontal.
      if (dy < 0 && Math.abs(dy) > THRESHOLD_V && Math.abs(dy) > Math.abs(dx) * 1.5) {
        revealAnswer();
      }
    }, { passive: true });
  })();

  init();
</script>
</body>
</html>
