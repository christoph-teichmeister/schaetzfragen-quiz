<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schätzfragen</title>
  <meta name="theme-color" content="#6366f1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Schätzfragen" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #ffffff;
      --surface:   #f8fafc;
      --border:    #e2e8f0;
      --text:      #0f172a;
      --text-2:    #64748b;
      --accent:    #6366f1;
      --accent-dk: #4f46e5;
      --accent-bg: #eef2ff;
      --answer:    #059669;
      --answer-bg: #ecfdf5;
      --hint:      #d97706;
      --hint-bg:   #fffbeb;
      --radius:    16px;
      --radius-sm: 10px;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ── SELECTOR VIEW ── */
    #view-selector {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding: 0 0 env(safe-area-inset-bottom);
    }
    #view-selector.hidden { display: none; }

    .selector-header {
      padding: 3rem 1.5rem 1rem;
      text-align: center;
    }
    .selector-header .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px; height: 52px;
      background: var(--accent);
      border-radius: 14px;
      font-size: 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 4px 14px rgba(99,102,241,0.35);
    }
    .selector-header h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .selector-header p {
      margin-top: 0.4rem;
      color: var(--text-2);
      font-size: 1rem;
    }

    .set-grid {
      flex: 1;
      padding: 1rem 1rem 1.5rem;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      align-content: start;
    }
    @media (min-width: 560px) {
      .set-grid { grid-template-columns: repeat(3, 1fr); padding: 1rem 1.5rem 2rem; }
    }
    @media (min-width: 860px) {
      .set-grid { grid-template-columns: repeat(4, 1fr); max-width: 900px; margin: 0 auto; }
      .selector-header { padding-top: 4rem; }
    }

    .set-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.5rem;
      padding: 1rem;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
      text-align: left;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }
    .set-card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-bg);
      transform: translateY(-1px);
    }
    .set-card:active { transform: scale(0.97); }
    .set-card .card-emoji {
      font-size: 1.75rem;
      line-height: 1;
    }
    .set-card .card-title {
      font-family: 'Syne', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }
    .set-card .card-count {
      font-size: 0.72rem;
      color: var(--text-2);
    }

    /* ── QUIZ VIEW ── */
    #view-quiz {
      display: none;
      flex-direction: column;
      height: 100svh;
      overflow: hidden;
    }
    #view-quiz.visible { display: flex; }

    /* Header bar */
    .quiz-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px; height: 36px;
      border: 1.5px solid var(--border);
      background: transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text);
      font-size: 1.1rem;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .back-btn:hover { background: var(--surface); }
    .set-pill {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.75rem;
      background: var(--accent-bg);
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent-dk);
      flex: 1;
      min-width: 0;
    }
    .set-pill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .q-counter {
      flex-shrink: 0;
      font-family: 'Syne', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-2);
    }

    /* Progress bar */
    .progress-track {
      flex-shrink: 0;
      height: 3px;
      background: var(--border);
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.4s ease;
    }

    /* Question area */
    .question-area {
      flex: 1;
      overflow-y: auto;
      padding: 1.75rem 1.25rem 1rem;
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 640px) {
      .question-area { padding: 2.5rem 2rem 1.5rem; max-width: 680px; margin: 0 auto; width: 100%; }
    }

    .q-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }
    .q-text {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.35rem, 4.5vw, 1.9rem);
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.01em;
      color: var(--text);
      flex-grow: 1;
    }

    /* Hint */
    .hint-wrap { margin-top: 1.5rem; }
    .hint-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.9rem;
      border: 1.5px solid var(--border);
      background: transparent;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--hint);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .hint-btn:hover { background: var(--hint-bg); border-color: var(--hint); }
    .hint-text {
      display: none;
      margin-top: 0.65rem;
      padding: 0.75rem 1rem;
      background: var(--hint-bg);
      border-left: 3px solid var(--hint);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: 0.92rem;
      color: var(--hint);
      animation: fadeUp 0.2s ease;
    }
    .hint-text.visible { display: block; }

    /* Answer panel */
    .answer-panel {
      display: none;
      margin-top: 1.5rem;
      padding: 1.25rem;
      background: var(--answer-bg);
      border: 1.5px solid #a7f3d0;
      border-radius: var(--radius);
      animation: fadeUp 0.3s ease;
    }
    .answer-panel.visible { display: block; }
    .answer-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--answer);
      margin-bottom: 0.5rem;
    }
    .answer-text {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.1rem, 3.5vw, 1.4rem);
      font-weight: 700;
      color: var(--answer);
      line-height: 1.25;
      margin-bottom: 0.65rem;
    }
    .answer-explanation {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #065f46;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Bottom action bar */
    .action-bar {
      flex-shrink: 0;
      padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    @media (min-width: 640px) {
      .action-bar { padding: 1rem 2rem calc(1rem + env(safe-area-inset-bottom)); }
    }

    .nav-arrow {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px; height: 44px;
      border: 1.5px solid var(--border);
      background: transparent;
      border-radius: var(--radius-sm);
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--text);
      transition: background 0.15s, border-color 0.15s;
    }
    .nav-arrow:hover:not(:disabled) { background: var(--surface); border-color: var(--text); }
    .nav-arrow:disabled { opacity: 0.25; cursor: default; }

    .reveal-btn {
      flex: 1;
      height: 44px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'Syne', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .reveal-btn:hover { background: var(--accent-dk); }
    .reveal-btn:active { transform: scale(0.98); }
    .reveal-btn.revealed {
      background: var(--surface);
      color: var(--text-2);
      border: 1.5px solid var(--border);
    }

    /* ── LOADING / ERROR ── */
    .loading {
      height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-2);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

<!-- SELECTOR -->
<div id="view-selector">
  <div class="selector-header">
    <div class="logo">🎯</div>
    <h1>Schätzfragen</h1>
    <p>Wähle ein Set und los geht's</p>
  </div>
  <div class="set-grid" id="set-grid">
    <div class="loading">Lade Sets…</div>
  </div>
</div>

<!-- QUIZ -->
<div id="view-quiz">
  <div class="quiz-bar">
    <button class="back-btn" onclick="showSelector()" title="Zurück zur Auswahl">←</button>
    <div class="set-pill">
      <span id="bar-emoji"></span>
      <span id="bar-title"></span>
    </div>
    <div class="q-counter" id="q-counter">1 / 7</div>
  </div>

  <div class="progress-track">
    <div class="progress-fill" id="progress-fill" style="width:0%"></div>
  </div>

  <div class="question-area" id="question-area">
    <div class="q-label" id="q-label">Frage 1</div>
    <div class="q-text" id="q-text"></div>

    <div class="hint-wrap">
      <button class="hint-btn" id="hint-btn" onclick="revealHint()">💡 Hinweis</button>
      <div class="hint-text" id="hint-text"></div>
    </div>

    <div class="answer-panel" id="answer-panel">
      <div class="answer-label">Antwort</div>
      <div class="answer-text" id="answer-text"></div>
      <div class="answer-explanation" id="answer-explanation"></div>
    </div>
  </div>

  <div class="action-bar">
    <button class="nav-arrow" id="prev-btn" onclick="navigate(-1)" title="Zurück">←</button>
    <button class="reveal-btn" id="reveal-btn" onclick="revealAnswer()">Antwort aufdecken</button>
    <button class="nav-arrow" id="next-btn" onclick="navigate(1)" title="Weiter">→</button>
  </div>
</div>

<script>
  let sets = [], activeSet = null, currentIndex = 0, revealed = {};

  async function init() {
    try {
      const files = await fetch('questions/index.json').then(r => r.json());
      sets = await Promise.all(files.map(f => fetch('questions/' + f).then(r => r.json())));
      renderGrid();
    } catch (e) {
      document.getElementById('set-grid').innerHTML =
        '<div class="loading">⚠️ Bitte lokalen Server starten (z.B. npx serve).</div>';
    }
  }

  function renderGrid() {
    const grid = document.getElementById('set-grid');
    grid.innerHTML = '';
    sets.forEach(set => {
      const card = document.createElement('button');
      card.className = 'set-card';
      const rev = (revealed[set.id] || new Set()).size;
      const total = set.questions.length;
      card.innerHTML = `
        <div class="card-emoji">${set.emoji}</div>
        <div class="card-title">${set.title}</div>
        <div class="card-count">${rev > 0 ? `${rev}/${total} gespielt` : `${total} Fragen`}</div>`;
      card.onclick = () => loadSet(set);
      grid.appendChild(card);
    });
  }

  function showSelector() {
    document.getElementById('view-selector').classList.remove('hidden');
    document.getElementById('view-quiz').classList.remove('visible');
    renderGrid(); // refresh counts
    window.scrollTo({ top: 0 });
  }

  function loadSet(set) {
    activeSet = set;
    currentIndex = 0;
    if (!revealed[set.id]) revealed[set.id] = new Set();
    document.getElementById('view-selector').classList.add('hidden');
    document.getElementById('view-quiz').classList.add('visible');
    renderQuestion();
  }

  function renderQuestion() {
    const q     = activeSet.questions[currentIndex];
    const total = activeSet.questions.length;
    const rev   = revealed[activeSet.id];
    const isRevealed = rev.has(currentIndex);

    // Bar
    document.getElementById('bar-emoji').textContent = activeSet.emoji;
    document.getElementById('bar-title').textContent = activeSet.title;
    document.getElementById('q-counter').textContent = `${currentIndex + 1} / ${total}`;

    // Progress: fraction of questions revealed
    const pct = Math.round((rev.size / total) * 100);
    document.getElementById('progress-fill').style.width = pct + '%';

    // Question
    document.getElementById('q-label').textContent = `Frage ${currentIndex + 1}`;
    document.getElementById('q-text').textContent  = q.question;

    // Hint — always reset
    document.getElementById('hint-text').textContent = q.hint;
    document.getElementById('hint-text').classList.remove('visible');
    document.getElementById('hint-btn').style.display = 'inline-flex';

    // Answer
    document.getElementById('answer-text').textContent        = q.answer;
    document.getElementById('answer-explanation').textContent = q.explanation;
    document.getElementById('answer-panel').classList.toggle('visible', isRevealed);

    // Reveal button
    const revBtn = document.getElementById('reveal-btn');
    if (isRevealed) {
      revBtn.textContent = '✓ Aufgedeckt';
      revBtn.classList.add('revealed');
    } else {
      revBtn.textContent = 'Antwort aufdecken';
      revBtn.classList.remove('revealed');
    }

    // Nav
    document.getElementById('prev-btn').disabled = currentIndex === 0;
    document.getElementById('next-btn').disabled = currentIndex === total - 1;

    // Scroll top
    document.getElementById('question-area').scrollTo({ top: 0 });
  }

  function revealHint() {
    document.getElementById('hint-text').classList.add('visible');
    document.getElementById('hint-btn').style.display = 'none';
  }

  function revealAnswer() {
    const rev = revealed[activeSet.id];
    if (rev.has(currentIndex)) return;
    rev.add(currentIndex);
    renderQuestion();
  }

  function navigate(dir) {
    const next = currentIndex + dir;
    if (next >= 0 && next < activeSet.questions.length) {
      currentIndex = next;
      renderQuestion();
    }
  }

  // Wake Lock
  let wakeLock = null;
  async function requestWakeLock() {
    if ('wakeLock' in navigator) {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') requestWakeLock();
  });
  requestWakeLock();

  // Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  init();
</script>
</body>
</html>
